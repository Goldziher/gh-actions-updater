version: "3"

tasks:
  set-version:
    desc: "Set version across packages and docs (usage: task set-version -- 1.2.3)"
    requires:
      vars: [CLI_ARGS]
    vars:
      VERSION: "{{.CLI_ARGS}}"
    cmds:
      - |
        set -euo pipefail
        python3 - "{{.VERSION}}" <<'PY'
        import json
        import re
        import sys
        from pathlib import Path

        version = sys.argv[1]
        if not re.fullmatch(r"\d+\.\d+\.\d+(?:-rc\.\d+)?", version):
            raise SystemExit(f"invalid version: {version}")

        py_version = re.sub(r"-rc\.(\d+)$", r"rc\1", version)

        def replace(path: str, pattern: str, repl: str) -> None:
            file = Path(path)
            text = file.read_text(encoding="utf-8")
            new = re.sub(pattern, repl, text, count=1, flags=re.MULTILINE)
            if new == text:
                raise SystemExit(f"pattern not found in {path}: {pattern}")
            file.write_text(new, encoding="utf-8")

        replace("Cargo.toml", r'^version = ".*"', f'version = "{version}"')
        replace(
            "pip-package/pyproject.toml",
            r'^version = ".*"',
            f'version = "{py_version}"',
        )
        replace(
            "pip-package/gh_actions_updater/__init__.py",
            r'^__version__ = ".*"',
            f'__version__ = "{py_version}"',
        )

        package = Path("npm-package/package.json")
        data = json.loads(package.read_text(encoding="utf-8"))
        data["version"] = version
        package.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

        replace("README.md", r"^Version: `.*`", f"Version: `{version}`")
        replace("README.md", r'"version": ".*"', f'"version": "{version}"')
        replace("README.md", r"rev: v[0-9][^\n]*", f"rev: v{version}")

        lock = Path("Cargo.lock")
        text = lock.read_text(encoding="utf-8")
        new = re.sub(
            r'(\[\[package\]\]\nname = "gh-actions-updater"\nversion = ")[^"]+(")',
            rf"\g<1>{version}\2",
            text,
            count=1,
        )
        if new == text:
            raise SystemExit("gh-actions-updater package entry not found in Cargo.lock")
        lock.write_text(new, encoding="utf-8")

        print(f"set version to {version} (PyPI: {py_version})")
        PY

  build:
    desc: "Build the release binary"
    cmds:
      - cargo build --locked --release

  test:
    desc: "Run the Rust test suite"
    cmds:
      - cargo test --locked --all-targets --all-features

  lint:
    desc: "Run formatting and clippy checks"
    cmds:
      - cargo fmt --all --check
      - cargo clippy --locked --all-targets --all-features -- -D warnings

  package:
    desc: "Validate Cargo, npm, and Python packages"
    cmds:
      - cargo package --locked
      - node --check npm-package/index.js
      - node --check npm-package/install.js
      - node --check npm-package/bin/gau
      - |
        set -euo pipefail
        cd npm-package
        npm pack --dry-run --cache /tmp/ghau-npm-cache
      - python3 -m compileall pip-package/gh_actions_updater
