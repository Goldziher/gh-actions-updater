[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-actions-updater"
version = "0.2.0"
description = "Fast GitHub Actions reference scanner and updater"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Na'aman Hirschfeld", email = "nhirschfeld@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
keywords = ["github-actions", "workflow", "ci", "cli", "updater"]
requires-python = ">=3.8"
dependencies = [
    "certifi>=2024.7.4",
]

[project.urls]
Homepage = "https://github.com/Goldziher/gh-actions-updater"
Repository = "https://github.com/Goldziher/gh-actions-updater.git"
Issues = "https://github.com/Goldziher/gh-actions-updater/issues"

[project.scripts]
gau = "gh_actions_updater.cli:main"

[tool.setuptools]
packages = ["gh_actions_updater"]
