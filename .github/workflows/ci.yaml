name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12.11.2"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: npm-package/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust targets
        run: cargo check --locked --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets --all-features

      - name: Check cargo package
        run: cargo package --locked

      - name: Check npm wrapper syntax and package contents
        run: |
          set -euo pipefail
          node --check npm-package/index.js
          node --check npm-package/install.js
          node --check npm-package/bin/gau
          cd npm-package
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm pack --dry-run

      - name: Check Python wrapper syntax and package build
        run: |
          set -euo pipefail
          python -m compileall -q pip-package/gh_actions_updater
          python -m pip install --upgrade pip build
          python -m build pip-package --outdir "${RUNNER_TEMP}/pip-dist"

      - name: Smoke scan repository workflows
        run: cargo run --locked -- --no-cache --no-schema-validation --format json .github
        env:
          GITHUB_TOKEN: ${{ github.token }}

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: actionlint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-targets --all-features
