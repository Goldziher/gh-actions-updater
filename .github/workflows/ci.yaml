name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1.22.2
    with:
      setup-rust: true

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy,rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: npm-package/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust targets
        run: cargo check --locked --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets --all-features

      - name: Check cargo package
        run: cargo package --locked

      - name: Check npm wrapper syntax and package contents
        run: |
          set -euo pipefail
          node --check npm-package/index.js
          node --check npm-package/install.js
          node --check npm-package/bin/gau
          cd npm-package
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm pack --dry-run

      - name: Check Python wrapper syntax and package build
        run: |
          set -euo pipefail
          python -m compileall -q pip-package/gh_actions_updater
          python -m pip install --upgrade pip build
          python -m build pip-package --outdir "${RUNNER_TEMP}/pip-dist"

      - name: Smoke scan repository workflows
        run: cargo run --locked -- --no-cache --no-schema-validation --format json .github
        env:
          GITHUB_TOKEN: ${{ github.token }}

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: actionlint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      - name: Run tests
        run: cargo test --locked --all-targets --all-features
