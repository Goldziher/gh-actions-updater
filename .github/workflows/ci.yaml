name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchain:
    name: Toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/check-toolchain@v1

  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No rust-toolchain.toml: the crate builds on stable, which this action installs. ~keep
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm python

      - name: Check Rust formatting and clippy
        run: mise run lint

      - name: Check Rust targets
        run: cargo check --locked --all-targets --all-features

      - name: Run Rust tests
        run: mise run test

      - name: Check cargo, npm and Python packages
        run: mise run package

      - name: Check Python wrapper syntax and package build
        run: |
          set -euo pipefail
          python -m compileall -q pip-package/gh_actions_updater
          python -m pip install --upgrade pip build
          python -m build pip-package --outdir "${RUNNER_TEMP}/pip-dist"

      - name: Smoke scan repository workflows
        run: cargo run --locked -- --no-cache --no-schema-validation --format json .github
        env:
          GITHUB_TOKEN: ${{ github.token }}

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: actionlint

      - name: Run actionlint
        run: actionlint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No rust-toolchain.toml: the crate builds on stable, which this action installs. ~keep
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          # The test task needs only mise and the Rust toolchain; install no mise tool. ~keep
          install: "false"

      - name: Run tests
        run: mise run test
