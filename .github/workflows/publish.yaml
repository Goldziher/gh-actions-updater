name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.1"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  meta:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
      tag: ${{ steps.version.outputs.tag }}
      crates_exists: ${{ steps.published.outputs.crates_exists }}
      npm_exists: ${{ steps.published.outputs.npm_exists }}
      pypi_exists: ${{ steps.published.outputs.pypi_exists }}
      release_assets_exist: ${{ steps.release_assets.outputs.release_assets_exist }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "unsupported release tag: $tag" >&2
            exit 2
          fi
          git rev-parse --verify "refs/tags/$tag"

          version="${tag#v}"
          if [[ "$version" == *"-rc."* ]]; then
            python_version="$(echo "$version" | sed -E 's/-rc\.([0-9]+)$/rc\1/')"
          else
            python_version="$version"
          fi

          {
            echo "version=$version"
            echo "python_version=$python_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Verify package versions
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          python_version="${{ steps.version.outputs.python_version }}"

          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          npm_version="$(node -p "require('./npm-package/package.json').version")"
          pypi_version="$(python - <<'PY'
          import tomllib
          with open('pip-package/pyproject.toml', 'rb') as file:
              print(tomllib.load(file)['project']['version'])
          PY
          )"
          runtime_python_version="$(python - <<'PY'
          namespace = {}
          with open('pip-package/gh_actions_updater/__init__.py', 'r', encoding='utf-8') as file:
              exec(file.read(), namespace)
          print(namespace['__version__'])
          PY
          )"

          test "$cargo_version" = "$version"
          test "$npm_version" = "$version"
          test "$pypi_version" = "$python_version"
          test "$runtime_python_version" = "$python_version"

      - name: Detect already-published versions
        id: published
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          python_version="${{ steps.version.outputs.python_version }}"

          crates_exists=false
          if curl -fsS \
            -H "User-Agent: gh-actions-updater-release (https://github.com/Goldziher/gh-actions-updater)" \
            "https://crates.io/api/v1/crates/gh-actions-updater/${version}" >/dev/null; then
            crates_exists=true
          fi

          npm_exists=false
          if npm view "gh-actions-updater@${version}" version >/dev/null 2>&1; then
            npm_exists=true
          fi

          pypi_exists=false
          if curl -fsS "https://pypi.org/pypi/gh-actions-updater/${python_version}/json" >/dev/null; then
            pypi_exists=true
          fi

          {
            echo "crates_exists=$crates_exists"
            echo "npm_exists=$npm_exists"
            echo "pypi_exists=$pypi_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Detect existing GitHub release assets
        id: release_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          expected_assets="$(
            cat <<ASSETS
          gh-actions-updater-aarch64-apple-darwin.tar.gz
          gh-actions-updater-aarch64-unknown-linux-gnu.tar.gz
          gh-actions-updater-x86_64-apple-darwin.tar.gz
          gh-actions-updater-x86_64-pc-windows-gnu.zip
          gh-actions-updater-x86_64-unknown-linux-gnu.tar.gz
          checksums.txt
          ASSETS
          )"
          release_assets_exist=true

          if ! gh release view "$tag" >/dev/null 2>&1; then
            release_assets_exist=false
          else
            asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            while IFS= read -r expected; do
              if ! grep -Fxq "$expected" <<<"$asset_names"; then
                release_assets_exist=false
              fi
            done <<<"$expected_assets"
          fi

          echo "release_assets_exist=$release_assets_exist" >> "$GITHUB_OUTPUT"

  create_release:
    name: Create GitHub release
    needs: meta
    if: needs.meta.outputs.release_assets_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Ensure the GitHub release exists as a draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            prerelease=""
            case "$tag" in
              *-rc.* | *-beta* | *-alpha*) prerelease="--prerelease" ;;
            esac
            gh release create "$tag" --title "$tag" --notes "Release $tag" --verify-tag --draft $prerelease
          fi

  build:
    name: Build binaries / ${{ matrix.triple }}
    needs: [meta, create_release]
    if: needs.meta.outputs.release_assets_exist != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - triple: x86_64-apple-darwin
            os: macos-latest
          - triple: aarch64-apple-darwin
            os: macos-latest
          - triple: x86_64-pc-windows-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.triple }}

      - name: Setup cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.triple }}

      - name: Install MinGW (Windows GNU cross-compile)
        if: matrix.triple == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build release binary
        if: matrix.triple != 'x86_64-pc-windows-gnu'
        run: cargo build --release --locked --target ${{ matrix.triple }}

      - name: Build release binary (Windows GNU cross-compile)
        if: matrix.triple == 'x86_64-pc-windows-gnu'
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --locked --target ${{ matrix.triple }}

      - name: Package release
        run: ./scripts/package-release.sh ${{ matrix.triple }}

      - name: Upload to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          triple="${{ matrix.triple }}"
          if [ "$triple" = "x86_64-pc-windows-gnu" ]; then
            archive="gh-actions-updater-${triple}.zip"
          else
            archive="gh-actions-updater-${triple}.tar.gz"
          fi
          if [ ! -f "$archive" ]; then
            echo "::error::Archive not found: $archive"
            exit 1
          fi
          gh release upload "$tag" "$archive" --clobber

  checksums:
    name: Generate and upload checksums
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Verify all 5 expected archives are present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"

          expected=(
            "gh-actions-updater-x86_64-unknown-linux-gnu.tar.gz"
            "gh-actions-updater-aarch64-unknown-linux-gnu.tar.gz"
            "gh-actions-updater-x86_64-apple-darwin.tar.gz"
            "gh-actions-updater-aarch64-apple-darwin.tar.gz"
            "gh-actions-updater-x86_64-pc-windows-gnu.zip"
          )

          gh release view "$tag" --json assets -q '.assets[].name' > /tmp/release_assets.txt || true

          missing_count=0
          for expected_asset in "${expected[@]}"; do
            if ! grep -q "^${expected_asset}$" /tmp/release_assets.txt 2>/dev/null; then
              echo "::error::Missing expected archive: $expected_asset"
              missing_count=$((missing_count + 1))
            fi
          done

          if [ $missing_count -gt 0 ]; then
            echo "::error::Release is incomplete: $missing_count of 5 platform archives missing."
            exit 1
          fi

          echo "✓ All 5 expected archives present"

      - name: Download archives and generate checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"

          gh release view "$tag" --json assets -q '.assets[] | select(.name | test("gh-actions-updater-.+\\.(tar\\.gz|zip)$")).name' | while read -r asset; do
            echo "Downloading $asset..."
            gh release download "$tag" -p "$asset" -O "$asset"
          done

          sha256sum gh-actions-updater-*.tar.gz gh-actions-updater-*.zip | sort > checksums.txt

          echo "✓ Generated checksums file"
          cat checksums.txt

      - name: Upload checksums to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.meta.outputs.tag }}"
          gh release upload "$tag" checksums.txt --clobber
          echo "✓ Uploaded checksums to release"

  finalize_release:
    name: Publish GitHub release
    needs: [meta, checksums]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Promote draft to published release once complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"

          required=(
            "gh-actions-updater-x86_64-unknown-linux-gnu.tar.gz"
            "gh-actions-updater-aarch64-unknown-linux-gnu.tar.gz"
            "gh-actions-updater-x86_64-apple-darwin.tar.gz"
            "gh-actions-updater-aarch64-apple-darwin.tar.gz"
            "gh-actions-updater-x86_64-pc-windows-gnu.zip"
            "checksums.txt"
          )

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            > /tmp/assets.txt || true
          missing=0
          for asset in "${required[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::release $tag is missing $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::release $tag is incomplete ($missing required assets missing); leaving it as a draft"
            exit 1
          fi

          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "✓ Promoted $tag to a published release"

  publish_crates:
    name: Publish crates.io
    needs: meta
    if: needs.meta.outputs.crates_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: crates_auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: |
          set -euo pipefail
          if cargo publish --locked 2>cargo-publish.err; then
            exit 0
          fi

          if grep -Eq "crate .* already exists" cargo-publish.err; then
            echo "crate already published; skipping"
            exit 0
          fi

          cat cargo-publish.err >&2
          exit 1

  publish_npm:
    name: Publish npm
    needs: [meta, finalize_release]
    if: needs.meta.outputs.npm_exists != 'true' && needs.finalize_release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          set -euo pipefail
          cd npm-package
          version="${{ needs.meta.outputs.version }}"
          if [[ "$version" == *"-rc."* ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          npm publish --provenance --access public --tag "$npm_tag"

  publish_pypi:
    name: Publish PyPI
    needs: [meta, finalize_release]
    if: needs.meta.outputs.pypi_exists != 'true' && needs.finalize_release.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Build Python package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          cd pip-package
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: pip-package/dist
          skip-existing: true

  publish_homebrew:
    name: Update Homebrew formula
    needs: [meta, finalize_release]
    if: needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.tag, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Generate formula and push to tap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "HOMEBREW_TOKEN not set — skipping the Homebrew formula update."
            exit 0
          fi
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          gh release download "$tag" -p "checksums.txt" -O checksums.txt
          ./scripts/update-homebrew-formula.sh "$version" checksums.txt > gh-actions-updater.rb

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TOKEN}@github.com/Goldziher/homebrew-tap.git" tap
          cp gh-actions-updater.rb tap/Formula/gh-actions-updater.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gh-actions-updater.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "gh-actions-updater ${version}"
            git push
          fi
