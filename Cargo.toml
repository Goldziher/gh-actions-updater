[package]
name = "gh-actions-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
memchr = "2"
saphyr = "0.0.6"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
