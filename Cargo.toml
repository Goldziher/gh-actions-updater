[package]
name = "gh-actions-updater"
version = "0.1.7"
edition = "2024"
rust-version = "1.85"
description = "Fast GitHub Actions reference scanner and updater"
license = "MIT"
repository = "https://github.com/Goldziher/gh-actions-updater"
homepage = "https://github.com/Goldziher/gh-actions-updater"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["github-actions", "ci", "cli", "workflow", "updater"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "src/**",
    "tests/**",
    "docs/**",
    ".pre-commit-hooks.yaml",
]

[[bin]]
name = "gau"
path = "src/main.rs"

[dependencies]
ahash = "0.8"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
jsonschema = { version = "0.48", default-features = false }
memchr = "2"
rayon = "1"
saphyr = "0.0.11"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
ureq = { version = "3.3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
